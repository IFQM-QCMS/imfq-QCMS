name: QCMS Production CI & Automated Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # BACKEND & SECURITY VERIFICATION
  # =========================================================================
  test-and-verify:
    name: "1. Build, Test & Security Verification"
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov flake8

      - name: "Run Syntax & Flake8 Check"
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: "Initialize CI Test Database"
        env:
          FLASK_ENV: testing
          ENVIRONMENT: testing
          TESTING: 'True'
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-qcms-enterprise-security
          JWT_SECRET_KEY: ci-test-jwt-secret-key-qcms-enterprise-security
        run: |
          cd backend
          flask --app app init-db

      - name: "Run Automated Pytest Test Suite"
        env:
          ENVIRONMENT: testing
          FLASK_ENV: testing
          TESTING: 'True'
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: 'sqlite:///qcms.db'
          SECRET_KEY: ci-test-secret-key-qcms-enterprise-security
          JWT_SECRET_KEY: ci-test-jwt-secret-key-qcms-enterprise-security
        run: |
          cd backend
          pytest tests -v

      - name: "Verify Docker Build"
        run: |
          docker build -t qcms-backend:ci-check ./backend

  # =========================================================================
  # =========================================================================
  # STAGE 2: PRODUCTION CD (Target: /opt/ifqm-octaqube-app)
  # =========================================================================
  cd-pipeline:
    name: "2. Production Deployment & Verification"
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: "Deploy to Hostinger VPS via SSH Key"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSPHRASE || secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e

            echo "========================================================="
            echo " [OctaQube CD] Starting Dedicated Production Deployment"
            echo "========================================================="

            # 1. Target designated application root
            TARGET_DIR="${{ secrets.PRODUCTION_PATH || '/opt/ifqm-octaqube-app' }}"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "[OctaQube CD ❌] Deployment target directory $TARGET_DIR does not exist!"
              exit 1
            fi
            cd "$TARGET_DIR"

            # 2. Safeguard Production Environment Configuration (.env)
            echo "[OctaQube CD] Safeguarding production .env files..."
            ENV_BACKUP_DIR=$(mktemp -d /tmp/octaqube_env_backup_XXXXXX)
            if [ -f "backend/.env" ]; then
              cp backend/.env "$ENV_BACKUP_DIR/backend.env"
            fi
            if [ -f ".env" ]; then
              cp .env "$ENV_BACKUP_DIR/root.env"
            fi

            # 3. Pull latest commit from main branch
            echo "[OctaQube CD] Fetching latest commit from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Restore production environment files
            if [ -f "$ENV_BACKUP_DIR/backend.env" ]; then
              cp "$ENV_BACKUP_DIR/backend.env" backend/.env
            fi
            if [ -f "$ENV_BACKUP_DIR/root.env" ]; then
              cp "$ENV_BACKUP_DIR/root.env" .env
            fi
            rm -rf "$ENV_BACKUP_DIR"
            echo "[OctaQube CD ✅] Production .env files preserved."

            # Determine docker compose configuration
            COMPOSE_FILE="docker-compose.prod.yml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              COMPOSE_FILE="docker-compose.yml"
            fi
            echo "[OctaQube CD] Using compose file: $COMPOSE_FILE"

            # 4. Non-Destructive Container Build (Traffic keeps serving)
            echo "[OctaQube CD] Building updated container images..."
            docker compose -f "$COMPOSE_FILE" build --pull backend

            # 5. Rolling Container Replacement (Zero downtime swap)
            echo "[OctaQube CD] Launching updated containers..."
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --build backend
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            # 6. Database Migration & Schema Synchronization (Fail on error)
            echo "[OctaQube CD] Running database schema synchronization..."
            docker compose -f "$COMPOSE_FILE" exec -T backend python -m app.infrastructure.database.migrations.runner

            # 7. Backend Health Probe Verification
            echo "[OctaQube CD] Running readiness probe..."
            MAX_RETRIES=30
            RETRY_COUNT=0
            HEALTHY=false

            until [ $RETRY_COUNT -ge $MAX_RETRIES ]
            do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/api/health/live || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "[OctaQube CD ✅] Backend readiness probe passed with HTTP 200 OK!"
                HEALTHY=true
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "[OctaQube CD] Waiting for backend to become ready... (Attempt $RETRY_COUNT/$MAX_RETRIES, HTTP $HTTP_CODE)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "[OctaQube CD ❌] ERROR: Backend failed readiness probe after $MAX_RETRIES attempts!"
              docker compose -f "$COMPOSE_FILE" logs --tail=100 backend
              exit 1
            fi

            echo "========================================================="
            echo " [OctaQube CD ✅] DEPLOYMENT COMPLETED SUCCESSFULLY!"
            echo "========================================================="
