name: QCMS Production CI & Automated Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # BACKEND & SECURITY VERIFICATION
  # =========================================================================
  test-and-verify:
    name: "1. Build, Test & Security Verification"
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov flake8

      - name: "Run Syntax & Flake8 Check"
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: "Initialize CI Test Database"
        env:
          FLASK_ENV: testing
          ENVIRONMENT: testing
          TESTING: 'True'
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-qcms-enterprise-security
          JWT_SECRET_KEY: ci-test-jwt-secret-key-qcms-enterprise-security
        run: |
          cd backend
          flask --app app init-db

      - name: "Run Automated Pytest Test Suite"
        env:
          ENVIRONMENT: testing
          FLASK_ENV: testing
          TESTING: 'True'
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: 'sqlite:///qcms.db'
          SECRET_KEY: ci-test-secret-key-qcms-enterprise-security
          JWT_SECRET_KEY: ci-test-jwt-secret-key-qcms-enterprise-security
        run: |
          cd backend
          pytest tests -v

      - name: "Verify Docker Build"
        run: |
          docker build -t qcms-backend:ci-check ./backend

  # =========================================================================
  # STAGE 2: CD (Deploy -> Run DB Migration -> Health Check -> Smoke Test)
  # =========================================================================
  cd-pipeline:
    name: "2. Production Deployment & Verification"
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      HOSTINGER_VPS_IP: ${{ secrets.HOSTINGER_VPS_IP }}

    steps:
      - name: "Deploy, Migrate & Verify on Production Host"
        if: env.HOSTINGER_VPS_IP != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          timeout: 300s
          command_timeout: 30m
          script: |
            set -e

            echo "========================================================="
            echo " [QCMS CI/CD] STARTING PRODUCTION DEPLOYMENT PIPELINE"
            echo "========================================================="

            # 1. Navigate to Project Directory
            cd /var/www/qcms || cd /home/${{ secrets.HOSTINGER_SSH_USER }}/qcms || exit 1

            # 2. Deploy: Pull Latest Code & Build Docker Images
            echo "[Step 1/5] Pulling latest git commit from main..."
            git fetch --all
            git reset --hard origin/main

            echo "[Step 2/5] Building and spinning up Docker containers..."
            docker compose down --remove-orphans || docker-compose down || true
            docker compose up -d --build || docker-compose up -d --build

            # 3. Run Database Migration & Schema Synchronization
            echo "[Step 3/5] Running automated database migrations & schema synchronization..."
            (docker compose exec -T backend flask db upgrade || docker-compose exec -T backend flask db upgrade || true)
            (docker compose exec -T backend python -m app.infrastructure.database.migrations.runner || docker-compose exec -T backend python -m app.infrastructure.database.migrations.runner || true)

            # 4. Health Check (Wait for readiness probe)
            echo "[Step 4/5] Running health check probes on backend..."
            MAX_RETRIES=30
            RETRY_COUNT=0
            HEALTHY=false

            until [ $RETRY_COUNT -ge $MAX_RETRIES ]
            do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/health/ready || curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health/ready || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "[QCMS Health Check] Backend readiness probe passed with HTTP 200 OK!"
                HEALTHY=true
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "[QCMS Health Check] Waiting for backend to become ready... (Attempt $RETRY_COUNT/$MAX_RETRIES, HTTP $HTTP_CODE)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "[QCMS Health Check] ERROR: Backend failed readiness probe after $MAX_RETRIES attempts!"
              docker compose logs --tail=100 backend
              exit 1
            fi

            # 5. Smoke Test Suite
            echo "[Step 5/5] Executing post-deployment smoke test suite..."
            docker compose exec -T backend python scripts/smoke_test.py http://127.0.0.1:5000 || \
            docker-compose exec -T backend python scripts/smoke_test.py http://127.0.0.1:5000 || \
            curl -f -s http://127.0.0.1:5000/health/live && curl -f -s http://127.0.0.1:5000/api/auth/maintenance-status

            # Cleanup unused images
            docker image prune -f

            echo "========================================================="
            echo " [QCMS CI/CD] DEPLOYMENT & VERIFICATION SUCCESSFUL!"
            echo "========================================================="
