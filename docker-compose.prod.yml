version: '3.9'

services:
  backend:
    image: qcms-backend:${QCMS_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - qcms-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "10"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms-celery-worker
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - qcms-internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "10"

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcms-celery-beat
    command: celery -A celery_worker.celery beat --loglevel=info
    env_file:
      - ./backend/.env
    networks:
      - qcms-internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  frontend:
    image: qcms-frontend:${QCMS_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qcms-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - qcms-internal
      - ifqm-new-sites
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "10"

networks:
  qcms-internal:
    external: true
  ifqm-new-sites:
    external: true
